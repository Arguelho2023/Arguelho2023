<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa Interativo DINTER e MINTER CDS/UnB 30 anos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
  <style>
    #map {
      height: 100vh;
    }
    .legend {
      background: white;
      padding: 10px;
      line-height: 1.5;
      border: 1px solid #ccc;
    }
    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([-10, -50], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var marker = L.circleMarker([-15.7684, -47.8695], {
        color: 'red',
        radius: 12,
        fillOpacity: 0.9
    }).addTo(map).bindPopup("CDS/UnB (Origem)");
    
    var marker = L.circleMarker([-3.13, -60.02], {
        color: 'blue',
        radius: 12,
        fillOpacity: 0.9
    }).addTo(map).bindPopup("Amazonas (Doutorado)");
    
    var marker = L.circleMarker([0.03, -51.07], {
        color: 'green',
        radius: 12,
        fillOpacity: 0.9
    }).addTo(map).bindPopup("Amapá (Mestrado)");
    
    var marker = L.circleMarker([-12.97, -38.51], {
        color: 'green',
        radius: 12,
        fillOpacity: 0.9
    }).addTo(map).bindPopup("Bahia (Mestrado)");
    
    var marker = L.circleMarker([-20.44, -54.65], {
        color: 'green',
        radius: 12,
        fillOpacity: 0.9
    }).addTo(map).bindPopup("Mato Grosso (Mestrado)");
    
    var marker = L.circleMarker([-7.23, -39.32], {
        color: 'orange',
        radius: 12,
        fillOpacity: 0.9
    }).addTo(map).bindPopup("Ceará (UFCE) (Parceiro nacional)");
    
        L.polyline([
            [-15.7684, -47.8695],
            [-3.13, -60.02]
        ], {
            color: 'blue',
            weight: 2,
            opacity: 0.8
        }).addTo(map);
        
        L.polyline([
            [-15.7684, -47.8695],
            [0.03, -51.07]
        ], {
            color: 'green',
            weight: 2,
            opacity: 0.8
        }).addTo(map);
        
        L.polyline([
            [-15.7684, -47.8695],
            [-12.97, -38.51]
        ], {
            color: 'green',
            weight: 2,
            opacity: 0.8
        }).addTo(map);
        
        L.polyline([
            [-15.7684, -47.8695],
            [-20.44, -54.65]
        ], {
            color: 'green',
            weight: 2,
            opacity: 0.8
        }).addTo(map);
        
        L.polyline([
            [-15.7684, -47.8695],
            [-7.23, -39.32]
        ], {
            color: 'orange',
            weight: 2,
            opacity: 0.8
        }).addTo(map);
        
    var legend = L.control({position: 'bottomleft'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'legend');
        div.innerHTML += "<strong>Legenda</strong><br>";
        div.innerHTML += '<i style="background: red"></i> Origem (CDS/UnB)<br>';
        div.innerHTML += '<i style="background: blue"></i> Doutorado<br>';
        div.innerHTML += '<i style="background: green"></i> Mestrado<br>';
        div.innerHTML += '<i style="background: orange"></i> Parceiro nacional<br>';
        return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
